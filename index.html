<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nPrincas - Minecraft Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #4ecca3;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: rgba(78, 204, 163, 0.1);
            border: 2px solid #4ecca3;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-box p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        
        .label {
            color: #4ecca3;
            font-weight: bold;
        }
        
        .coming-soon {
            font-size: 1.3em;
            color: #ffd700;
            margin: 20px 0;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 nPrincas</h1>
        <p class="subtitle">Minecraft Server</p>
        
        <div class="info-box">
            <p class="coming-soon">🚀 Coming Soon</p>
            <p>We're setting up an amazing Minecraft server experience.</p>
            <p style="margin-top: 15px; font-size: 0.95em; color: #ccc;">More details will be added soon!</p>
        </div>
        
        <div class="footer">
            <p>Stay tuned for updates...</p>
        </div>
    </div>
</body>
</html>
