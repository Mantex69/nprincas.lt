<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPrinco Hata - Minecraft Serveris</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Mantex69/nprincas.lt/main/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('https://raw.githubusercontent.com/Mantex69/nprincas.lt/main/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #4ecca3;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .minecraft-server {
            background: linear-gradient(135deg, rgba(78, 204, 163, 0.2), rgba(92, 184, 92, 0.2));
            border: 2px solid #5cb85c;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(92, 184, 92, 0.3);
        }
        
        .minecraft-server h2 {
            color: #5cb85c;
            font-size: 1.5em;
            margin-bottom: 12px;
        }
        
        .server-ip {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 16px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            color: #4ecca3;
            word-break: break-all;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #4ecca3;
        }
        
        .server-ip:hover {
            background: rgba(78, 204, 163, 0.2);
            box-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }
        
        .copy-hint {
            font-size: 0.85em;
            color: #aaa;
            margin-top: 8px;
        }
        
        .info-box {
            background: rgba(78, 204, 163, 0.1);
            border: 2px solid #4ecca3;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-box p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        
        .label {
            color: #4ecca3;
            font-weight: bold;
        }
        
        .coming-soon {
            font-size: 1.3em;
            color: #ffd700;
            margin: 20px 0;
        }
        
        .discord-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
            font-size: 1.1em;
        }
        
        .discord-btn:hover {
            background: #4752C4;
        }
        
        .discord-btn svg {
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 NPrinco Hata</h1>
        <p class="subtitle">Minecraft Serveris</p>
        
        <div class="minecraft-server">
            <h2>📍 Serverio Adresas</h2>
            <div class="server-ip" onclick="copyToClipboard('mc.nprincas.lt')">
                mc.nprincas.lt
            </div>
            <p class="copy-hint">💡 Spausk norėdamas nukopijuoti adresą</p>
        </div>
        
        <div class="info-box">
            <p class="coming-soon">🚀 Serveris kurimo stadyjoje...</p>
            <p>Kuriame nuostabią Minecraft serverio patirtį.</p>
            <p style="margin-top: 15px; font-size: 0.95em; color: #ccc;">Daugiau informacijos netrukus!</p>
            
            <a href="https://discord.com/invite/nm2MjNC" class="discord-btn" target="_blank">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.607 1.25a18.27 18.27 0 0 0-5.487 0c-.163-.386-.395-.875-.608-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.294.075.075 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.075.075 0 0 1 .079.009c.12.098.246.198.373.295a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-4.467.151-8.343-2.118-12.64a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-.965-2.157-2.156 0-1.193.93-2.157 2.157-2.157 1.226 0 2.157.964 2.157 2.157 0 1.19-.93 2.155-2.157 2.155zm7.975 0c-1.183 0-2.157-.965-2.157-2.156 0-1.193.93-2.157 2.157-2.157 1.226 0 2.157.964 2.157 2.157 0 1.19-.931 2.155-2.157 2.155z"/>
                </svg>
                Prisijunk prie Discord
            </a>
        </div>
        
        <div class="footer">
            <p>Sekite mūsų atnaujinimus...</p>
        </div>
    </div>
    
    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Serverio adresas nukopijuotas: ' + text);
            }).catch(() => {
                alert('⚠️ Nepavyko nukopijuoti');
            });
        }
    </script>
</body>
</html>
